name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun i

      - name: Format
        run: bun run format-check

      - name: Type Check
        run: bun tsc

      - name: Build
        run: bun run build

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Keep in sync with the Lambda runtime in lambda.tf
          node-version: 24

      - name: Smoke Test Lambda Bundle
        # Load the handler from the packaged zip the way Lambda does: as CommonJS, with
        # require(esm) and module syntax detection off, so an ESM bundle fails here too.
        run: |
          bun run package
          unzip -q proxy-lambda.zip -d "$RUNNER_TEMP/lambda"
          cd "$RUNNER_TEMP/lambda"
          node --no-experimental-require-module --no-experimental-detect-module -e "
            if (typeof require('./build/proxy.js').handler !== 'function') throw new Error('build/proxy.js does not export handler');
          "

      - name: Test
        run: bun run test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Terraform Docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          git-push: true
          output-file: USAGE.md

  terraform:
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read .terraform-version
        run: echo TF_VERSION=`cat .terraform-version` >> $GITHUB_ENV

      - name: Setup
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        uses: dflook/terraform-validate@v3.1.0

      - name: Terraform FMT
        uses: dflook/terraform-fmt@v3.1.0

      - name: Terraform Lint
        uses: reviewdog/action-tflint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true
